function resize() {
  const vw = window.innerWidth, vh = window.innerHeight;
  rotated = vh > vw;
  const gw = rotated ? vh : vw, gh = rotated ? vw : vh;
  scale = Math.min(gw / W, gh / H);
  dpr = Math.min(window.devicePixelRatio || 1, 2);
  cv.width = Math.round(W * scale * dpr);
  cv.height = Math.round(H * scale * dpr);
  cv.style.width = (W * scale) + 'px';
  cv.style.height = (H * scale) + 'px';
  cv.classList.toggle('rot', rotated);
}
window.addEventListener('resize', resize);
window.addEventListener('orientationchange', () => setTimeout(resize, 200));
resize();

// ---------- 전투 판정 ----------
function hurtEnemy(e, dmg, dir, kb) {

  e.hp -= dmg;
  e.hurtT = e.boss ? 0.08 : 0.28;
  e.kbx = dir * (e.boss ? kb * 0.15 : kb);
  if (!e.boss && (e.state === 'windup' || e.state === 'charge' || e.state === 'chargeWind')) { e.state = 'walk'; e.cool = 0.8; }
  G.P.gauge = Math.min(100, G.P.gauge + (has(3) ? 8 : 5));
  G.score += dmg;
  G.nums.push({ x: e.x, y: e.y - e.z - 70 * e.scale, v: dmg, t: 0.8 });
  for (let i = 0; i < 6; i++) G.fx.push({ type: 'spark', x: e.x + (Math.random() - 0.5) * 20, y: e.y - e.z - 40 * e.scale + (Math.random() - 0.5) * 20, vx: (Math.random() - 0.5) * 300, vy: -Math.random() * 250, t: 0.35, col: '#fff7a8' });
  sfx('hit');
  if (e.hp <= 0) {
    e.state = 'dead'; e.t = e.boss ? 1.4 : 0.7; e.kbx = dir * 260; G.score += e.boss ? 1000 : 50;
    sfx('die');
    if (!e.boss && Math.random() < (has(1) ? 0.4 : 0.22)) G.items.push({ x: e.x, y: e.y, t: 0 });
    if (e.boss) {
      G.enemies.forEach(o => { if (o !== e && o.state !== 'dead') { o.state = 'dead'; o.t = 0.7; } });
      G.queue = []; G.slow = 0.25; G.shake = 0.6;

}
function hurtPlayer(dmg, dir, force) {
  const P = G.P;

  if (has(3)) dmg = Math.max(1, Math.round(dmg * 0.5));   // 광전사의 갑주: 방어력 2배
  P.hp -= dmg; P.invul = 1.0; P.state = 'hurt'; P.t = 0.35; P.kbx = dir * 280; P.combo = 0;

}

// ---------- 업데이트 ----------
function updatePlay(dt) {
  const P = G.P, c = CHARS[charKey];
  dt *= G.slow;
  if (G.slow < 1) G.slow = Math.min(1, G.slow + dt * 0.6);
  G.bannerT -= dt; G.shake = Math.max(0, G.shake - dt);

  // 페이즈
  if (G.phase === 'bossdown') {
    G.phaseT += dt;
    if (G.phaseT > 1.3) { G.phase = 'rescue'; G.phaseT = 0; G.dialog = 0; sfx('clear'); }
  } else if (G.phase === 'dying') {
    P.t -= dt;
    if (P.t <= 0) { setScene('over'); }
  }

  // 플레이어
  P.invul -= dt; P.atkCD -= dt; P.rangedCD -= dt; P.comboT -= dt;
  if (P.state === 'hurt') {
    P.t -= dt; P.x += P.kbx * dt; P.kbx *= 0.88;
    if (P.t <= 0) P.state = 'idle';
  } else if (P.state === 'down') {
    // 쓰러짐
  } else if (G.phase === 'play' || G.phase === 'bossdown') {
    const canAct = G.phase === 'play';
    if (P.state === 'atk' || P.state === 'special' || P.state === 'throw' || P.state === 'shoot') {
      P.t -= dt;
      if (P.state === 'atk' && !P.hitDone && P.t < P.dur * 0.67) { P.hitDone = true; meleeHit(); }
      if (P.state === 'throw' && !P.hitDone && P.t < P.dur * 0.5) { P.hitDone = true; releaseShield(); }
      if (P.state === 'shoot' && !P.hitDone && P.t < P.dur * 0.5) { P.hitDone = true; fireball(); }
      if (P.state === 'special') {
        P.spin += dt * 25;
        if (charKey === 'sudal' && Math.floor(P.t * 10) !== Math.floor((P.t + dt) * 10)) spinHit();
      }
      if (P.state === 'atk') P.x += P.dir * 40 * dt;
      if (P.t <= 0) { P.state = 'idle'; P.spin = 0; }
    } else {
      const spd = c.speed * (has(0) ? 1.2 : 1) * (has(3) ? 1.5 : 1);
      P.x += input.mx * spd * dt; P.y += input.my * spd * 0.65 * dt;
      if (input.mx > 0.1) P.dir = 1; else if (input.mx < -0.1) P.dir = -1;
      P.state = (Math.abs(input.mx) + Math.abs(input.my) > 0.1) ? 'walk' : 'idle';
      if (P.state === 'walk') P.walkT += dt;
      if (canAct && input.c && P.z === 0) { P.vz = 560; sfx('jump'); }
      if (canAct && input.s && P.gauge >= 100) doSpecial();
      else if (canAct && input.a && P.atkCD <= 0) doAttack();
      else if (canAct && input.b && P.rangedCD <= 0 && !(charKey === 'sudal' && G.shield)) doRanged();
    }
  }
  // 점프 물리
  if (P.z > 0 || P.vz > 0) { P.z += P.vz * dt; P.vz -= 1600 * dt; if (P.z <= 0) { P.z = 0; P.vz = 0; } }
  P.y = Math.max(GROUND_TOP + 10, Math.min(GROUND_BOT, P.y));
  input.a = input.b = input.c = input.s = false;

  // 카메라와 웨이브
  const maxCam = G.worldLen - W;
  if (G.lock) {
    G.cam += (G.lockCam - G.cam) * Math.min(1, dt * 4);
    P.x = Math.max(G.cam + 40, Math.min(G.lockCam + W - 40, P.x));
  } else {
    const target = Math.min(maxCam, Math.max(G.cam, P.x - 400));
    G.cam += (target - G.cam) * Math.min(1, dt * 5);
    P.x = Math.max(G.cam + 40, Math.min(G.worldLen - 40, P.x));
    if (G.wave < 4 && P.x > G.triggers[G.wave]) { G.go = false; startWave(); }
  }
  if (G.lock && G.queue.length) {
    G.spawnT -= dt;
    const alive = G.enemies.filter(e => e.state !== 'dead').length;
    if (G.spawnT <= 0 && alive < (G.bossSpawned ? 4 : 4)) {
      const q = G.queue.shift();
      const x = q.side > 0 ? G.lockCam + W + 60 : G.lockCam - 60;
      spawnEnemy(q.k, x);
      G.spawnT = 0.7 + Math.random() * 0.5;
    }
  }
  { const bb = G.bossRef, P = G.P;
    if (bb && bb.hp > 0 && bb.boltCD !== undefined && G.phase === 'play' && G.bossSpawned) {
      if (bb.armorT > 0) { bb.armorT -= dt; if (bb.armorT <= 0) { bb.armor = true; G.banner = '먹구름 장막이 다시 덮였다!'; G.bannerT = 1.8; } }
      bb.boltCD -= dt;
      if (bb.boltCD <= 0) {
        const half = bb.hp < bb.maxHp * 0.5; bb.boltCD = half ? 4 : 5.5;

          G.bolts.push({ x: Math.max(G.lockCam + 60, Math.min(G.lockCam + W - 60, bx)), y: Math.max(GROUND_TOP + 15, Math.min(GROUND_BOT - 5, by)), t: 1.0, hit: false });
        }
      }
      bb.sumCD -= dt;
      if (bb.sumCD <= 0 && !G.queue.length) { bb.sumCD = 9; G.queue.push({ k: G.S.minions[0], side: 1 }, { k: G.S.minions[1], side: -1 }); }
    }
    if (bb && bb.hp > 0 && bb.pigCD !== undefined && G.phase === 'play' && G.bossSpawned && bb.state !== 'charge') {
      bb.pigCD -= dt;
      const alive = G.enemies.filter(o => o.kind === 'piglet' && o.state !== 'dead').length;
      if (bb.pigCD <= 0 && alive < 5) {        // 무한리필! 새끼 흑돼지 발사
        const half = bb.hp < bb.maxHp * 0.5; bb.pigCD = half ? 2.4 : 3.4;
        bb.dir = P.x > bb.x ? 1 : -1;
        for (let k = 0; k < (half ? 2 : 1); k++) {
          const pg = spawnEnemy('piglet', bb.x + bb.dir * 70, bb.y);
          const ty = Math.max(GROUND_TOP + 10, Math.min(GROUND_BOT, P.y + (k ? (Math.random() - 0.5) * 90 : 0)));
          const dist = Math.max(160, Math.min(560, Math.abs(P.x - bb.x) + 40 + k * 60));
          Object.assign(pg, { state: 'launch', t: 0, dur: 0.75 + dist / 1400, vx: bb.dir * dist / (0.75 + dist / 1400), ty, dir: bb.dir, hitDone: false });
        }
        G.nums.push({ x: bb.x, y: bb.y - 230, v: '리필!', t: 0.8 }); sfx('shot');
      }
    }
    // 3판 보스: "퇴근 좀 하자!!" 직선 레이저 (3초 충전 뒤 발사)
    if (bb && bb.hp > 0 && bb.laserCD !== undefined && G.phase === 'play' && G.bossSpawned) {
      if (bb.state === 'laser') {
        const L = bb.beam; L.t += dt;
        if (L.t >= L.ch && !L.fired) { L.fired = true; G.shake = 0.45; sfx('special'); }
        if (L.fired && !L.hit && L.t < L.ch + 0.7) {
          const ahead = (P.x - L.x0) * L.dir;
          if (ahead > -30 && Math.abs(P.y - L.y) < 34 && P.z < 90) { L.hit = true; hurtPlayer(56, L.dir); }
        }
        if (L.t >= L.ch + 0.7) { bb.state = 'walk'; bb.cool = 0.8; bb.beam = null; bb.laserCD = bb.hp < bb.maxHp * 0.5 ? 5 : 7; }
      } else if (bb.state === 'walk') {
        bb.laserCD -= dt;
        if (bb.laserCD <= 0) {
          bb.dir = P.x > bb.x ? 1 : -1; bb.state = 'laser';
          bb.beam = { t: 0, dir: bb.dir, x0: bb.x + bb.dir * (bb.laserFire ? 120 : 95), y: bb.y, fired: false, hit: false, ch: bb.laserCh, fire: bb.laserFire };
          G.say = { text: bb.laserSay, e: bb, t: Math.max(1.6, bb.laserCh - 0.6) }; sfx('boss');
        }
      }
    }
    // 1판 보스: "5억 내놔~!" 먹물 발사
    if (bb && bb.hp > 0 && bb.inkCD !== undefined && G.phase === 'play' && G.bossSpawned) {
      if (bb.state === 'inkSpit') { bb.inkT -= dt; if (bb.inkT <= 0) { bb.state = 'walk'; bb.cool = 0.6; } }
      else if (bb.state === 'walk') {
        bb.inkCD -= dt;
        if (bb.inkCD <= 0) {
          const half = bb.hp < bb.maxHp * 0.5; bb.inkCD = half ? 4.5 : 6;
          bb.dir = P.x > bb.x ? 1 : -1; bb.state = 'inkSpit'; bb.inkT = 0.7;
          G.say = { text: '5억 내놔~!', e: bb, t: 1.6 }; sfx('shot');
          const n = half ? 5 : 3;
          for (let k = 0; k < n; k++) {
            const tx = Math.max(G.lockCam + 40, Math.min(G.lockCam + W - 40, P.x + (k ? (Math.random() - 0.5) * 260 : 0)));
            const ty = Math.max(GROUND_TOP + 10, Math.min(GROUND_BOT, P.y + (k ? (Math.random() - 0.5) * 110 : 0)));
            G.inks.push({ sx: bb.x + bb.dir * 60, sy: bb.y, tx, ty, t: -k * 0.12, dur: 0.85, landed: false, life: 2.5 });
          }
        }
      }
    }
    for (const k of G.inks) {
      k.t += dt;
      if (!k.landed && k.t >= k.dur) {
        k.landed = true; sfx('hit');
        if (Math.abs(P.x - k.tx) < 52 && Math.abs(P.y - k.ty) < 30 && P.z < 60) { hurtPlayer(9, P.x > k.tx ? 1 : -1); G.inkT = 2.2; }
      }
      if (k.landed) k.life -= dt;
    }
    G.inks = G.inks.filter(k => k.life > 0);
    if (G.say) { G.say.t -= dt; if (G.say.t <= 0 || G.say.e.hp <= 0) G.say = null; }
    if (G.inkT > 0) G.inkT -= dt;
    for (const sh of G.eshots) {                // 날아가는 대나무
      sh.x += sh.vx * dt; sh.life -= dt; if (sh.type === 'bamboo' || sh.type === 'stone') sh.rot += dt * 14; if (sh.type === 'wind') sh.rot += dt * 10;
      if (!sh.hit && Math.abs(P.x - sh.x) < 34 && Math.abs(P.y - sh.y) < 26 && P.z < 70) { sh.hit = true; sh.life = 0; hurtPlayer(sh.dmg, Math.sign(sh.vx)); }
    }
    G.eshots = G.eshots.filter(sh => sh.life > 0);
    if (G.phase !== 'play') { G.inks = []; G.eshots = []; if (G.bossRef && G.bossRef.beam) { G.bossRef.beam = null; } }
    if (G.phase !== 'play') G.bolts = [];
    for (const b of G.bolts) {
      b.t -= dt;
      if (b.t <= 0 && !b.hit) { b.hit = true; G.shake = 0.3; sfx('hit'); if (Math.abs(P.x - b.x) < 50 && Math.abs(P.y - b.y) < 28 && P.z < 50) hurtPlayer(b.dmg || 18, P.x > b.x ? 1 : -1); }
    }
    G.bolts = G.bolts.filter(b => b.t > -0.2);
  }
  if (G.bossRef && !G.bossHalf && G.bossRef.hp < G.bossRef.maxHp * 0.5 && G.bossRef.hp > 0) {
    G.bossHalf = true;
    G.queue.push({ k: G.S.minions[0], side: 1 }, { k: G.S.minions[1], side: -1 }, { k: G.S.minions[0], side: -1 });
  }
  if (G.lock && G.phase === 'play' && !G.queue.length && G.enemies.every(e => e.state === 'dead') && G.wave < 3) {
    G.lock = false; G.wave++; G.go = true; G.goT = 0;
  }
  if (G.go) { G.goT += dt; if (G.goT > 4) G.go = false; }

  // 적
  for (const e of G.enemies) updateEnemy(e, dt);
  G.enemies = G.enemies.filter(e => !(e.state === 'dead' && e.t <= 0));
  // 적 간 겹침 방지
  for (let i = 0; i < G.enemies.length; i++) for (let j = i + 1; j < G.enemies.length; j++) {
    const a = G.enemies[i], b = G.enemies[j];
    if (a.state === 'dead' || b.state === 'dead') continue;
    const dx = b.x - a.x, dy = b.y - a.y;
    if (Math.abs(dx) < 40 && Math.abs(dy) < 18) { const push = (dx >= 0 ? 1 : -1) * 40 * dt; a.x -= push; b.x += push; }
  }

  // 마법탄
  for (const s of G.shots) {
    s.x += s.vx * dt; s.life -= dt;
    if (s.beam) {
      s.len = Math.min(s.purple ? 420 : 260, s.len + Math.abs(s.vx) * dt);
      for (const e of G.enemies) {

        const d = (s.x - e.x) * Math.sign(s.vx);
        if (d > -e.w / 2 - s.r && d < s.len + e.w / 2 && Math.abs(e.y - s.y) < 40 * Math.max(1, e.scale * 0.7)) {
          s.hit.add(e); hurtEnemy(e, s.dmg, Math.sign(s.vx), 260);
          for (let i = 0; i < 10; i++) G.fx.push({ type: 'spark', x: e.x, y: s.y - s.z, vx: (Math.random() - 0.5) * 420, vy: -Math.random() * 300, t: 0.45, col: (s.ice ? ['#2f8cff', '#9fe0ff', '#ffffff'] : s.purple ? ['#9b4dff', '#e0b8ff', '#ffffff'] : s.bolt ? ['#ffd54a', '#ffffff', '#ffb02e'] : ['#ff7a1c', '#ffd54a', '#ff3b1a'])[i % 3] });
        }
      }
      if (Math.random() < 0.9) G.fx.push({ type: 'spark', x: s.x - Math.sign(s.vx) * Math.random() * s.len, y: s.y - s.z + (Math.random() - 0.5) * 30, vx: (Math.random() - 0.5) * 80, vy: -40 - Math.random() * 80, t: 0.35, col: (s.ice ? ['#2f8cff', '#9fe0ff', '#ffffff'] : s.purple ? ['#9b4dff', '#e0b8ff', '#ffffff'] : s.bolt ? ['#ffd54a', '#ffffff', '#ffb02e'] : ['#ff7a1c', '#ffd54a', '#ff3b1a'])[Math.floor(Math.random() * 3)] });
      continue;
    }
    for (const e of G.enemies) {
      if (e.state === 'dead' || s.life <= 0) continue;
      if (Math.abs(e.x - s.x) < e.w / 2 + s.r && Math.abs(e.y - s.y) < 34 * Math.max(1, e.scale * 0.7)) {
        hurtEnemy(e, s.dmg, Math.sign(s.vx), s.fire ? 280 : 120);
        s.life = 0;
        G.fx.push({ type: 'ring', x: s.x, y: s.y - s.z, t: 0.35, col: s.fire ? '#ff8a2a' : '#ff9ec4', r: s.r });
        if (s.fire) {
          for (const o of G.enemies) if (o !== e && o.state !== 'dead' && Math.abs(o.x - e.x) < 90 && Math.abs(o.y - e.y) < 45) hurtEnemy(o, 8, Math.sign(s.vx), 160);
          for (let i = 0; i < 14; i++) G.fx.push({ type: 'spark', x: s.x, y: s.y - s.z, vx: (Math.random() - 0.5) * 520, vy: -Math.random() * 320, t: 0.5, col: ['#ff7a1c', '#ffd54a', '#ff4a1a'][i % 3] });
          G.shake = Math.max(G.shake, 0.12);
        }
      }
    }
    if (Math.random() < 0.6) G.fx.push({ type: 'spark', x: s.x, y: s.y - s.z + (Math.random() - 0.5) * 10, vx: -s.vx * 0.1, vy: (Math.random() - 0.5) * 60, t: 0.3, col: (s.fire ? ['#ff7a1c', '#ffd54a', '#ff4a1a'] : ['#ffb3d1', '#fff2a8', '#a8e6ff'])[Math.floor(Math.random() * 3)] });
  }
  G.shots = G.shots.filter(s => s.life > 0);
  updateShield(dt);

  // 검은 그림자 함정
  if (G.hintT > 0) G.hintT -= dt;
  for (const tr of G.traps) {
    if (tr.state === 'idle') {
      if (Math.abs(P.x - tr.x) < 44 && Math.abs(P.y - tr.y) < 18 && P.z < 25) {
        tr.state = 'sprung'; tr.t = 0;
        const kind = G.S.trapKind || 'shark';
        if (kind === 'shark') {
          const e = spawnEnemy(kind, tr.x, GROUND_TOP - 6);

        G.banner = G.S.trapMsg || '우크라이스가 튀어나온다!'; G.bannerT = 1.4;
      }
    } else tr.t += dt;
  }
  // 아이템(귤)
  for (const it of G.items) {
    it.t += dt;
    if (Math.abs(it.x - P.x) < 45 && Math.abs(it.y - P.y) < 30 && P.z < 30) {
      it.got = true; P.hp = Math.min(P.maxHp, P.hp + 25); G.score += 30; sfx('pick');
      G.nums.push({ x: P.x, y: P.y - 140, v: '+25', t: 0.8, heal: true });
    }
  }
  G.items = G.items.filter(i => !i.got && i.t < 12);

  for (const f of G.fx) if (f.type === 'firerain' && !f.hitDone && f.T - f.t > (f.meteor ? 0.7 : 0.4)) {
    f.hitDone = true; G.shake = 0.35; sfx('hit');
    const L = G.lock ? G.lockCam : G.cam;
    G.specHit = true;   // 필살기 피해로 인정 (먹구름 장막도 깨진다)
    for (const e of G.enemies) if (e.state !== 'dead' && e.x > L - 40 && e.x < L + W + 40) hurtEnemy(e, f.dmg || 45, e.x > f.px ? 1 : -1, 300);
    G.specHit = false;
  }
  for (const f of G.fx) { f.t -= dt; if (f.vx !== undefined) { f.x += f.vx * dt; f.y += f.vy * dt; f.vy += 600 * dt; } }
  G.fx = G.fx.filter(f => f.t > 0);
  for (const n of G.nums) { n.t -= dt; n.y -= 50 * dt; }
  G.nums = G.nums.filter(n => n.t > 0);
}

    TALE_ART[P.art](pt, t);
    ctx.fillStyle = 'rgba(0,0,0,0.5)'; rr(16, 14, 300, 44, 22); ctx.fill();
    txt(D.title, 34, 37, 22, '#fff', 'left', TITLE_FONT);
    for (let i = 0; i <= np; i++) circ(340 + i * 20, 36, i === T.page ? 7 : 5, i <= T.page ? '#ffd43b' : 'rgba(255,255,255,0.5)');
    ctx.fillStyle = 'rgba(255,255,255,0.96)'; rr(40, 396, 880, 126, 18); ctx.fill(); ctx.strokeStyle = '#222'; ctx.lineWidth = 4; ctx.stroke();
    ctx.fillStyle = S.godColor; rr(58, 384, 130, 30, 10); ctx.fill(); ctx.stroke();
    txt('옛이야기', 123, 400, 18, '#222', 'center', TITLE_FONT);
    const shown = P.text.slice(0, Math.floor((sceneT - T.tt0) * TALE_CPS)), done = shown.length >= P.text.length;
    let left = shown.length; tlWrap(P.text, 830, 24).forEach((l, i) => { if (left > 0) txt(l.slice(0, left), 66, 436 + i * 34, 24, '#222', 'left'); left -= l.length + 1; });
    if (done && Math.floor(t * 3) % 2) txt('▼ 터치', 900, 506, 16, '#888', 'right');
    const adv = () => {
      if (!done) { T.tt0 = -999; return; }
      T.page++; T.t0 = sceneT; T.tt0 = sceneT;
    };
    uiButtons.push({ x: 0, y: 0, w: W, h: H, fn: adv }); keyConfirm = adv;
    button(W - 150, 12, 134, 42, '건너뛰기 ▶', taleStart, { bg: '#fff', size: 18 });
    if (pt < 0.45) { ctx.fillStyle = 'rgba(0,0,0,' + (1 - pt / 0.45) + ')'; ctx.fillRect(0, 0, W, H); }
  } else {
    drawTaleFacts(t, T, D, S, pt);
    if (pt < 0.45) { ctx.fillStyle = 'rgba(0,0,0,' + (1 - pt / 0.45) + ')'; ctx.fillRect(0, 0, W, H); }
  }
}
function drawTaleFacts(t, T, D, S, pt) {
  tlGrad(0, H, '#fff6dc', '#ffe3a6');
  for (let i = 0; i < 16; i++) sparkle(hash(i + 20) * W, hash(i + 31) * H, 5 + hash(i) * 6, Math.max(0, 0.35 + 0.35 * Math.sin(t * 2 + i)));
  tlGod(S.godImg, 170, 500 + Math.sin(t * 2) * 4, 390, { glow: 'rgba(255,255,255,0.9)' });
  ctx.fillStyle = '#fffdf3'; rr(340, 50, 590, 416, 22); ctx.fill(); ctx.strokeStyle = '#222'; ctx.lineWidth = 5; ctx.stroke();
  ctx.fillStyle = '#e8453c'; rr(520, 28, 230, 52, 12); ctx.fill(); ctx.stroke(); txt('알아두기!', 635, 55, 30, '#fff', 'center', TITLE_FONT);
  let y = 118;
  D.facts.forEach((f, i) => {
    const a = Math.min(1, Math.max(0, (pt - 0.4 - i * 0.6) * 2.5)); if (a <= 0) { return; }
    const lines = tlWrap(f, 480, 22);
    ctx.save(); ctx.globalAlpha = a; ctx.translate(0, (1 - a) * 12);
    circ(376, y + 4, 16, S.godColor); ctx.strokeStyle = '#222'; ctx.lineWidth = 3; ctx.beginPath(); ctx.arc(376, y + 4, 16, 0, 6.28); ctx.stroke(); txt(String(i + 1), 376, y + 5, 20, '#222', 'center', TITLE_FONT);
    lines.forEach((l, k) => txt(l, 404, y + k * 28, 22, '#222', 'left'));
    ctx.restore();
    y += Math.max(1, lines.length) * 28 + 26;
  });
  txt('※ 제주 신화는 마을과 굿마다 조금씩 다르게 전해져요.', 635, 444, 15, '#888', 'center');
  button(W - 330, 476, 300, 54, '이야기 끝! 모험 시작', taleStart, { size: 24 });
  uiButtons.unshift({ x: 0, y: 0, w: W, h: H, fn: () => { if (pt > 1.5) taleStart(); } });
  keyConfirm = () => { if (pt > 1.5) taleStart(); };
}

// ================== 메인 루프 ==================
let last = performance.now();
function frame(now) {
  let dt = Math.min(0.05, (now - last) / 1000); last = now;
  gT += dt; sceneT += dt;
  readMove();
  ctx.setTransform(dpr * scale, 0, 0, dpr * scale, 0, 0);
  uiButtons = [];
  if (scene !== 'play') { tapHandler = null; }
  switch (scene) {
    case 'loading': drawLoading(); break;
    case 'title': drawTitle(gT); break;
    case 'select': drawSelect(gT); break;
    case 'map': drawMap(gT); break;
    case 'play':
      if (!paused) updatePlay(dt);
      else { input.a = input.b = input.c = input.s = false; }
      keyConfirm = null;
      drawPlay(gT); break;
    case 'clear': drawClear(gT); break;
    case 'over': drawOver(gT); break;
    case 'ending': drawEnding(gT); break;
    case 'tale': drawTale(gT); break;
  }
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);

Promise.all([loadSprites(), (document.fonts ? Promise.race([Promise.all([document.fonts.load('40px "Black Han Sans"'), document.fonts.load('20px "Jua"')]), new Promise(r => setTimeout(r, 2500))]) : Promise.resolve())])
  .then(() => setScene('title'));
</script>
